input {
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "log_queue"
    codec => "json"
  }
}

filter {
  # Parse JSON message field if present
  if [message] and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
    if "_jsonparsefailure" not in [tags] {
      mutate {
        rename => { "[parsed][event_type]" => "event_type" }
        rename => { "[parsed][src_ip]" => "src_ip" }
        rename => { "[parsed][dest_ip]" => "dest_ip" }
        rename => { "[parsed][severity]" => "severity" }
        rename => { "[parsed][message]" => "log_message" }
        rename => { "[parsed][source]" => "log_source" }
        rename => { "[parsed][timestamp]" => "timestamp" }
        rename => { "[parsed][port]" => "port" }
        rename => { "[parsed][protocol]" => "protocol" }
        rename => { "[parsed][action]" => "action" }
        rename => { "[parsed][user]" => "username" }
        rename => { "[parsed][severity_label]" => "severity_label" }
        rename => { "[parsed][is_attack]" => "is_attack" }
        rename => { "[parsed][attack_patterns]" => "attack_patterns" }
      }
      mutate {
        remove_field => ["parsed"]
      }
    }
  }

  # Ensure severity is integer
  if [severity] {
    mutate {
      convert => { "severity" => "integer" }
    }
  }

  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss'Z'", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # Add ingestion metadata
  mutate {
    add_field => { "ingested_at" => "%{@timestamp}" }
  }

  # Remove original message to save space
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
  }
}