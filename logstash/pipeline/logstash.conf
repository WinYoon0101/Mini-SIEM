input {
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "log_queue"
  }
}

filter {
  # Tại đây bạn có thể thêm các logic lọc (grok, mutate)
  json {
    source => "message"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
  }
}