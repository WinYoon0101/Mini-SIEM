services:
  # 0. Nạp Index Template trước khi Logstash/API tạo index siem-logs-*
  es-bootstrap:
    image: curlimages/curl:8.5.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[es-bootstrap] Applying index template siem-logs..."
        curl -sfS -X PUT "http://elasticsearch:9200/_index_template/siem-logs" \
          -H "Content-Type: application/json" \
          --data-binary @/template.json
        echo "[es-bootstrap] Done."
    volumes:
      - ./elasticsearch/index-templates/siem-logs-template.json:/template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # 1. Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 2. Redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 3. Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    environment:
      - PIPELINE_WORKERS=2
      - PIPELINE_BATCH_SIZE=1000
      - PIPELINE_BATCH_DELAY=50
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-bootstrap:
        condition: service_completed_successfully

  # 4. API Collector
  api-collector:
    build: ./api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      es-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # 5. Custom Dashboard
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html
      - ./dashboard/style.css:/usr/share/nginx/html/style.css
      - ./dashboard/app.js:/usr/share/nginx/html/app.js
    depends_on:
      - api-collector
    restart: unless-stopped

  # 6. Target Nginx
  nginx-target:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./log_sources/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web_app_target/index.html:/usr/share/nginx/html/index.html
      - ./web_app_target/style.css:/usr/share/nginx/html/style.css
      - ./web_app_target/app.js:/usr/share/nginx/html/app.js
      - nginx_logs:/var/log/nginx
    restart: unless-stopped

  # 6b. Khởi tạo volume audit log (tránh lần đầu root:root 755 khiến nginx không ghi được)
  modsec-log-init:
    image: busybox:1.36
    entrypoint: ["/bin/sh", "/init/modsec-log-init.sh"]
    volumes:
      - modsec_logs:/var/log/modsec
      - ./log_sources/modsec-log-init.sh:/init/modsec-log-init.sh:ro
    restart: "no"

  # 7. ModSecurity WAF
  modsecurity-waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports:
      - "8443:8080"
    environment:
      - BACKEND=http://nginx-target:80
      - MODSEC_AUDIT_ENGINE=On
      - MODSEC_AUDIT_LOG=/var/log/modsec/audit.log
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - MODSEC_AUDIT_LOG_RELEVANT_STATUS=^(?:5|4(?!04))
      - PORT=8080
      - MODSEC_RULE_ENGINE=On
    volumes:
      - modsec_logs:/var/log/modsec
      - ./log_sources/modsecurity-override.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-005-AUDIT-LOGGING.conf:ro
      - ./log_sources/99-fix-perms.sh:/docker-entrypoint.d/99-fix-perms.sh:ro
    depends_on:
      modsec-log-init:
        condition: service_completed_successfully
      nginx-target:
        condition: service_started
    restart: unless-stopped

  # 8. Log Collector
  log-collector:
    build: ./log_sources
    environment:
      - API_URL=http://api-collector:8000
      - BATCH_INTERVAL=5
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - modsec_logs:/var/log/modsec:ro
    depends_on:
      - api-collector
      - nginx-target
      - modsecurity-waf
    restart: unless-stopped

volumes:
  es_data:
    driver: local

  nginx_logs:
    driver: local

  modsec_logs:
    driver: local