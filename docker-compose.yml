services:
  # 0. Nạp Index Template (Composable) trước khi Logstash/API tạo index siem-logs-*
  es-bootstrap:
    image: curlimages/curl:8.5.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[es-bootstrap] Applying index template siem-logs..."
        curl -sfS -X PUT "http://elasticsearch:9200/_index_template/siem-logs" \
          -H "Content-Type: application/json" \
          --data-binary @/template.json
        echo "[es-bootstrap] Done."
    volumes:
      - ./elasticsearch/index-templates/siem-logs-template.json:/template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # 1. Database lưu trữ - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 2. Giao diện quản lý - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-bootstrap:
        condition: service_completed_successfully

  # 3. Message Queue - Redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 4. Bộ xử lý log - Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    environment:
      - PIPELINE_WORKERS=4
      - PIPELINE_BATCH_SIZE=2000
      - PIPELINE_BATCH_DELAY=50
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 5. API nhận & truy vấn log
  api-collector:
    build: ./api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      es-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # 6. Dashboard visualization
  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html
      - ./dashboard/style.css:/usr/share/nginx/html/style.css
      - ./dashboard/app.js:/usr/share/nginx/html/app.js
    depends_on:
      - api-collector
    restart: unless-stopped

volumes:
  es_data:
    driver: local